name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6  
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_mojo/libs

      - name: Get cloudflared (ARM64) for the MCP Companion tunnel
        continue-on-error: true
        run: |
          mkdir -p app_mojo/src/main/jniLibs/arm64-v8a
          curl -fL --retry 3 -o app_mojo/src/main/jniLibs/arm64-v8a/libcloudflared.so \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64
          chmod +x app_mojo/src/main/jniLibs/arm64-v8a/libcloudflared.so
          ls -la app_mojo/src/main/jniLibs/arm64-v8a/libcloudflared.so

      - name: Build cloudflared with Android DNS patch (clone)
        continue-on-error: true
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/cloudflare/cloudflared/releases/latest | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          echo "cloudflared tag: $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/cloudflare/cloudflared cloudflared-src
          cp .github/cloudflared/androiddns.go cloudflared-src/cmd/cloudflared/androiddns.go

      - uses: actions/setup-go@v5
        continue-on-error: true
        with:
          go-version-file: cloudflared-src/go.mod
          cache: false

      - name: Build cloudflared with Android DNS patch (compile)
        continue-on-error: true
        working-directory: cloudflared-src
        run: |
          if CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../app_mojo/src/main/jniLibs/arm64-v8a/libcloudflared.so ./cmd/cloudflared; then
            SZ=$(stat -c %s ../app_mojo/src/main/jniLibs/arm64-v8a/libcloudflared.so)
            echo "::notice::PATCHED cloudflared built OK (${SZ} bytes, $(go version))"
          else
            echo "::warning::PATCHED cloudflared build FAILED - using the prebuilt one (tunnel DNS will not work)"
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create out directory
        run: mkdir out
      - name: Build Publishing .aab
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_mojo:bundleFullGplay
          mv app_mojo/build/outputs/bundle/fullGplay/app_mojo-full-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          # Build the launcher (compile errors are echoed as annotations so they are easy to read)
          set +e
          gradle :app_mojo:assembleFullDebug 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -E "error:|What went wrong|Execution failed|Caused by|symbol:|location:|AAPT|Could not|Duplicate" build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
            exit "$rc"
          fi
          mv app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk out/app-debug-full.apk

      - name: Build Release .apk (normal, non-debug)
        run: |
          set +e
          gradle :app_mojo:assembleFullRepo2Release 2>&1 | tee release.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -E "error:|What went wrong|Execution failed|Caused by|symbol:|location:|AAPT|Could not|Duplicate" release.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
            exit "$rc"
          fi
          mv app_mojo/build/outputs/apk/full/repo2Release/app_mojo-full-repo2Release.apk out/app-release-full.apk

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_mojo:assembleNoruntimeDebug
          mv app_mojo/build/outputs/apk/noruntime/debug/app_mojo-noruntime-debug.apk out/app-debug-noruntime.apk
      - name: Build Nightly Release .apk
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_mojo:assembleFullPubRelease
          mv app_mojo/build/outputs/apk/full/pubRelease/app_mojo-full-pubRelease.apk out/MojoLauncher-release.apk
      - name: Gen md5sums
        run: |
          md5sum out/app-debug-full.apk > out/app-debug-full.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug-full.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/app-release-full.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.apk

      - name: Release Nightly APK
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: softprops/action-gh-release@v3
        with:
          name: MojoLauncher Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            MojoLauncher nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/MojoLauncher-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: git.artdeell.mjlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
