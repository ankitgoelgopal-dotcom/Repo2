name: Build MCP telemetry mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/mcp-telemetry/**'
      - '.github/workflows/build-mod.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/mcp-telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build mod
        run: |
          set +e
          gradle build 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -E "error:|What went wrong|Execution failed|Caused by|symbol:|location:|Could not|not found" build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
            exit "$rc"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-telemetry-mod
          path: |
            mods/mcp-telemetry/build/libs/*.jar
            !mods/mcp-telemetry/build/libs/*-sources.jar
      - name: Publish jar for the launcher's Pre mods download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/mcp-telemetry-*.jar | grep -v sources | head -1)
          cp "$JAR" /tmp/mcp-telemetry.jar
          gh release view mcp-telemetry --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create mcp-telemetry --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "MCP Telemetry mod (latest build)" --notes "Auto-published by CI. Downloaded by the launcher's Pre mods screen." --prerelease
          gh release upload mcp-telemetry /tmp/mcp-telemetry.jar --repo "${{ github.repository }}" --clobber
