name: Build MCP telemetry mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/mcp-telemetry/**'
      - '.github/workflows/build-mod.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/mcp-telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build mod
        run: |
          set +e
          gradle build 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -E "error:|What went wrong|Execution failed|Caused by|symbol:|location:|Could not|not found" build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
            exit "$rc"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-telemetry-mod
          path: |
            mods/mcp-telemetry/build/libs/*.jar
            !mods/mcp-telemetry/build/libs/*-sources.jar
